name: Continuous Deployment (CD) to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-aws:
    name: Deploy to AWS Cloud
    runs-on: ubuntu-latest
    
    needs: build 

    steps:
      - name: Pobranie kodu źródłowego
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Konfiguracja poświadczeń AWS (E1)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy Warstwy Web - Frontend do S3 (E3)[cite: 17]
        run: |
          echo "Budowanie paczki produkcyjnej frontendu..."
          cd frontend
          npm ci
          npm run build
          echo "Wysyłanie plików statycznych na AWS S3..."
          # Tutaj musimy odkomentować to czyli usunąć znak przed i uzupełnić nazwe bucketu który mamy
          # aws s3 sync build/ s3://nazwa-naszego-bucketu-s3 --delete

      - name: Deploy Warstwy App - Backend (E4)[cite: 17]
        run: |
          echo "Wdrażanie backendu do AWS (np. App Runner / ECS / EC2)..."
          cd backend
          npm install
          # Tutaj trzeba dać komendy wdrożeniowe dla backendu Node.js

      - name: Live Healthcheck i Weryfikacja (E5)
        run: |
          echo "Wdrożenie zakończone sukcesem! System gotowy pod adresem publicznym."
